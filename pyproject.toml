[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage-agent"
version = "0.1.0"
description = "A GitHub issue triage agent built on its own MCP server, benchmarked on real issues the maintainers already triaged."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yash Bhosale" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "anyio>=4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
triage = "triage.cli:main"
triage-mcp = "triage.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
